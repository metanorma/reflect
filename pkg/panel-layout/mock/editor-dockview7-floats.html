<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metanorma editor — floating panel groups (dockview v7 live)</title>

<!-- Real dockview stylesheet (theme vars + structural rules) -->
<link rel="stylesheet" href="https://unpkg.com/dockview-core@7.0.4/dist/styles/dockview.css">

<!-- Library chrome, served from a root at pkg/panel-layout/ (the parity
     server, tests/parity/serve.mjs, and the goldens capture tool):
     panel-layout.css is the HAND-OWNED library chrome sheet (D45 — the
     extraction pipeline retired; these links are its sole source, so this
     page must be served, not opened from file://); focus.css is the
     hand-authored G3 ring sheet (D28). Both load AFTER dockview.css
     (additive source-order wins). -->
<link rel="stylesheet" href="/panel-layout.css">
<link rel="stylesheet" href="/focus.css">

<style>
  /* ============================================================
     Live mock — dockview v7.0.4 floating windows.
     Main grid = Document only, full viewport. Every panel group is a
     FLOATING WINDOW whose nested gridview (v7 SerializedFloatingGroup.grid)
     hosts a vertical stack of groups: shared width = window; moves as one
     window. All of that is native v7 — where the FlexLayout mock needed
     ~800 lines of custom drag code, dockview v7 ships nested-gridview
     floats with pointer DnD into/out of them.
     SIZING MODEL (absolute per-tabset heights): each tabset OWNS its
     height (pinned via min==max constraints); the window's height is just
     the sum of its tabsets plus chrome (titlebar + borders + sashes) —
     never adjusted directly, never redistributed. Sashes resize the
     tabset ABOVE; the window's bottom edge resizes the LAST tabset; a
     group keeps its height when moved between windows. Heights persist
     in localStorage and survive reload.
     Custom bits kept from the FlexLayout mock: window titles in the float
     titlebar, panel auto-wrap on empty space, layout persistence.
     NOTE: no viewport-edge snapping for tabset groups — with a group
     already flush to an edge, snapping another into the same band stacks
     them into an overlap (free-form float placement instead).
     ============================================================ */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--chrome);font-family:var(--sans);color:var(--ink);overflow:hidden}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        color:#cfd6dd;font:13px var(--sans);background:#22262c;z-index:99;
        white-space:pre-line;text-align:center}
  /* full-bleed editor surface (no mock browser-window chrome: the fake
     titlebar/lights/rounded frame/backdrop were removed — the editor's own
     toolbar + statusbar remain the app chrome) */
  .window{width:100vw;height:100vh;max-width:100%;
          background:var(--chrome);
          display:flex;flex-direction:column;
          position:relative}
  .toolbar{display:flex;align-items:center;gap:4px;padding:7px 12px;background:#fff;
           border-bottom:1px solid var(--line);font-size:12px}
  .tb-btn{border:1px solid transparent;background:transparent;border-radius:6px;
          padding:4px 8px;color:var(--ink);font-size:12px;cursor:pointer}
  .tb-btn:hover{background:var(--chrome)}
  .tb-btn.on{background:var(--accent-bg);color:var(--accent-ink);border-color:#c4d7f7}
  .tb-sep{width:1px;height:18px;background:var(--line);margin:0 6px}
  .tb-spacer{flex:1}
  .layoutArea{flex:1;min-height:0;position:relative;background:#e3e7eb}
  .statusbar{display:flex;align-items:center;gap:16px;padding:6px 14px;background:#fff;
             border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--warn-line);
                  display:inline-block;margin-right:5px;vertical-align:-.5px}
  .statusbar .grow{flex:1}
  .statusbar .live{font-family:var(--mono);font-size:10px;color:var(--accent-ink)}

  /* edge-snap indicator retired (snapping removed) — kept: none */

</style>

<!-- Demo panel-content CSS — the byte-identical migration of the
     panel-content region this file's <style> used to carry (D39). RELATIVE
     so it resolves on the parity server and the goldens server (both
     rooted at pkg/panel-layout/) and from file://; cascade position is the
     region's original one (last); every selector is disjoint from library
     chrome. -->
<link rel="stylesheet" href="../demo/panel-content.css">

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.8?target=es2022",
    "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime?target=es2022",
    "react-dom": "https://esm.sh/react-dom@19.2.8?target=es2022&deps=scheduler@0.27.0",
    "react-dom/client": "https://esm.sh/react-dom@19.2.8/client?target=es2022&deps=scheduler@0.27.0",
    "dockview-core": "https://esm.sh/dockview-core@7.0.4?target=es2022",
    "dockview": "https://esm.sh/dockview@7.0.4?bundle&external=react,react-dom&target=es2022",
    "dockview-react": "https://esm.sh/dockview-react@7.0.4?bundle&external=react,react-dom&target=es2022",
    "@metanorma/panel-layout": "/dist/mock/panel-layout.js"
  }
}
</script>
</head>
<body>
<div id="boot">Loading React + dockview v7 from CDN (esm.sh / unpkg)…
(this one-off needs network access)</div>
<div id="root"></div>

<script type="module">
const boot = document.getElementById('boot');
try {
  const { createElement: h } = await import('react');
  const { createRoot } = await import('react-dom/client');
  // The BUILT artifacts this page consumes (served by the parity server,
  // tests/parity/serve.mjs, rooted at pkg/panel-layout/):
  //   /dist/mock/panel-layout.js       — the library (entry internal.ts,
  //     every peer external; the public surface re-exports index.ts).
  //   /dist/mock/panel-layout-demo.js  — the demo surface (entry
  //     demo/index.ts — the '@metanorma/panel-layout/demo' subpath, D38).
  //     Its library dependency is the bare package name, which the
  //     importmap above maps to the library artifact: the demo consumes
  //     the library exactly as a third-party consumer would.
  // Everything this mock historically carried inline — first the behavior
  // layers (pin model, window-drag tracking, takeover drag, unwrap/veto
  // engine, titlebar chrome, persistence wiring, focus restoration, the
  // error boundary), then the demo material too (the 11 panel bodies, the
  // registry, the preset, the storage keys, the toolbar/statusbar chrome,
  // the App assembly), and finally the design tokens + library chrome
  // themselves (D45: the extraction pipeline retired; the linked
  // panel-layout.css is the sole source, no inline duplication) — lives in
  // those two artifacts plus the linked sheets. This page is: the boot
  // overlay, the app-shell CSS, and ONE mount.
  await import('/dist/mock/panel-layout.js');
  const { DemoApp } = await import('/dist/mock/panel-layout-demo.js');

  createRoot(document.getElementById('root')).render(h(DemoApp));
  boot.remove();
} catch (err) {
  boot.textContent = 'Failed to load from CDN: ' + (err && err.message || err) +
    '\n\nThis page imports react@19 + dockview v7 from esm.sh/unpkg and needs network access.';
  console.error(err);
}
</script>
</body>
</html>
